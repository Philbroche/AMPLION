[build]
  command = "npm run build"
  publish = "dist"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Set Node version
[build.environment]
  NODE_VERSION = "18"

# Security headers (CSP + hardening), applied to every page.
# The sha256 in script-src allows the n8n chat widget that is added through
# Netlify "Snippet injection" (Site settings > Build & deploy > Post processing),
# not through index.html. If that snippet is edited, its hash changes and the
# chat stops loading: recompute the hash and update it here.
# Google Tag Manager / Clarity domains are pre-allowed for the consent-gated
# analytics on feat/clarity-consent.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://assets.calendly.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://*.clarity.ms 'sha256-rJII39RmnJksl7SlNSSvwl1uH2NwOW5r2L/eCc4Buz4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://tvwnrvxuzvtzzxwdflta.supabase.co wss://tvwnrvxuzvtzzxwdflta.supabase.co https://n8n-pbroch17-u44914.vm.elestio.app https://calendly.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.clarity.ms https://c.bing.com; frame-src https://calendly.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
